<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b21b6">
<title>Quantum Week Dare Wheel</title>
<style>
  :root{--purple:#5b21b6;--magenta:#c026d3;--blue:#2563eb;--bg:#faf7ff;--ink:#1a1033;--muted:#6b6485;--line:#e6dcf7}
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;padding:18px 16px 40px;position:relative;
    background:
      linear-gradient(rgba(91,33,182,.045) 1px,transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg,rgba(91,33,182,.045) 1px,transparent 1px) 0 0/32px 32px,
      radial-gradient(circle at 15% 0%,#efe3ff 0,transparent 45%),
      radial-gradient(circle at 90% 25%,#dbe8ff 0,transparent 42%),var(--bg)}
  .kets{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .kets span{position:absolute;font-family:"Times New Roman",serif;font-style:italic;color:var(--purple);opacity:.12;font-size:1.6rem;animation:drift 14s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(5deg)}}
  .wrap{max-width:460px;margin:0 auto;text-align:center;position:relative;z-index:1}
  .logo{height:46px;margin:4px auto 6px;display:block}
  .pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);background:#fff;border:1px solid var(--line);padding:5px 12px;border-radius:99px}
  h1{font-size:1.9rem;line-height:1.1;margin:14px 0 6px}
  h1 span{background:linear-gradient(90deg,var(--purple),var(--magenta),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);margin:0 0 34px}
  .stage{position:relative;width:min(80vw,320px);margin:0 auto 40px}
  .orbits{position:absolute;left:50%;top:50%;width:150%;height:150%;transform:translate(-50%,-50%);z-index:0;pointer-events:none}
  canvas{position:relative;z-index:1;width:100%;height:auto;display:block;filter:drop-shadow(0 10px 26px rgba(91,33,182,.3))}
  .glow{position:absolute;inset:-6%;border-radius:50%;z-index:0;background:radial-gradient(circle,rgba(192,38,211,.22),transparent 68%);animation:pulse 3.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
  .pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--ink);z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
  .hub{position:absolute;left:50%;top:50%;width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;background:#fff;box-shadow:0 0 0 5px var(--purple),0 0 18px rgba(124,58,237,.55);color:var(--purple);cursor:pointer;z-index:3;line-height:1.05}
  .hub b{display:block;font-family:"Times New Roman",serif;font-style:italic;font-size:1.35rem;font-weight:400}
  .hub small{display:block;font-weight:800;font-size:.72rem;letter-spacing:.12em}
  .hub:disabled{opacity:.85;cursor:default}
  .result{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(91,33,182,.1);min-height:112px;display:flex;flex-direction:column;justify-content:center}
  .result .tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;font-weight:700;color:var(--magenta);margin-bottom:6px}
  .result .d{font-size:1.2rem;font-weight:700}
  .result .n{color:var(--muted);font-size:.92rem;margin-top:6px}
  .go{margin-top:16px;display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--purple),var(--magenta))}
  .go:disabled{opacity:.6}
  .site{display:inline-block;margin-top:16px;color:var(--purple);font-weight:600;text-decoration:none}
  .foot{color:var(--muted);font-size:.82rem;margin-top:12px}
  @media (prefers-reduced-motion:reduce){.kets span,.glow{animation:none}}
</style>
</head>
<body>
<div class="kets" aria-hidden="true">
  <span style="left:6%;top:12%">|0⟩</span>
  <span style="left:84%;top:18%;animation-delay:-3s">|1⟩</span>
  <span style="left:12%;top:68%;animation-delay:-6s">|ψ⟩</span>
  <span style="left:80%;top:72%;animation-delay:-9s">ħ</span>
  <span style="left:46%;top:92%;animation-delay:-4s">|+⟩</span>
  <span style="left:70%;top:46%;animation-delay:-7s;font-size:1.1rem">H</span>
</div>

<div class="wrap">
  <img class="logo" src="https://www.quantumweek.tech/logos/qw_black.png" alt="Quantum Week 2026" onerror="this.style.display='none'">
  <span class="pill">Conclave &middot; 30 Oct &middot; MSRIT</span>
  <h1>Spin the <span>Quantum Dare</span> Wheel</h1>
  <p class="sub">Do the dare, show it at the stall, get a chocolate 🍫</p>

  <div class="stage">
    <svg class="orbits" viewBox="-200 -200 400 400" aria-hidden="true">
      <g fill="none" stroke="#7c3aed" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="4 5">
        <ellipse rx="190" ry="68"/>
        <ellipse rx="190" ry="68" transform="rotate(60)"/>
        <ellipse rx="190" ry="68" transform="rotate(120)"/>
      </g>
      <g><circle r="5" fill="#c026d3"><animateMotion dur="7s" repeatCount="indefinite" path="M-190,0 a190,68 0 1,0 380,0 a190,68 0 1,0 -380,0"/></circle></g>
      <g transform="rotate(60)"><circle r="5" fill="#2563eb"><animateMotion dur="9s" repeatCount="indefinite" path="M-190,0 a190,68 0 1,0 380,0 a190,68 0 1,0 -380,0"/></circle></g>
      <g transform="rotate(120)"><circle r="5" fill="#5b21b6"><animateMotion dur="11s" repeatCount="indefinite" path="M-190,0 a190,68 0 1,0 380,0 a190,68 0 1,0 -380,0"/></circle></g>
    </svg>
    <div class="glow"></div>
    <div class="pointer"></div>
    <canvas id="wheel" width="680" height="680"></canvas>
    <button class="hub" id="hub"><b>|ψ⟩</b><small>SPIN</small></button>
  </div>

  <div class="result" id="result">
    <div class="tag">state: |superposition⟩</div>
    <div class="d">Tap SPIN to collapse the wave function ⚛️</div>
  </div>
  <button class="go" id="again" hidden>Measure again</button>

  <a class="site" href="https://www.quantumweek.tech/" target="_blank" rel="noopener">quantumweek.tech &rarr;</a>
  <p class="foot">One chocolate per dare, while stocks last.</p>
</div>

<script>
const dares = [
  {l:"Register\nyourself", d:"Register yourself", n:"Show your confirmation at the stall."},
  {l:"Share poster\nin class group", d:"Share the poster in your class group", n:"Show the sent message as proof."},
  {l:"Random person\nregisters", d:"Make a random person register", n:"Someone you don't know. Bring them to the stall."},
  {l:"3 friends\nregister", d:"Make 3 friends register", n:"All three, no excuses."},
  {l:"What's a\nqubit?", d:"Tell us: what's a qubit? Then register", n:"One line is enough. Say it out loud at the stall."},
  {l:"15-sec\npitch", d:"Pitch Quantum Week to a stranger in 15 seconds", n:"If they register, you win."},
  {l:"Poster\nselfie", d:"Take a selfie with the poster", n:"Post it on your story and tag @quantum_msrit."},
  {l:"Other-branch\nfriend", d:"Get a friend from another branch to register", n:"Non-CSE counts."}
];
const colors = ["#5b21b6","#c026d3","#2563eb","#db2777","#7c3aed","#0284c7","#a21caf","#4338ca"];

const canvas = document.getElementById('wheel'), ctx = canvas.getContext('2d');
const W = canvas.width, C = W/2, R = C - 8, seg = 2*Math.PI/dares.length;
let rot = 0, spinning = false;

function draw(){
  ctx.clearRect(0,0,W,W);
  ctx.save(); ctx.translate(C,C); ctx.rotate(rot);
  dares.forEach((d,i)=>{
    const g = ctx.createRadialGradient(0,0,40,0,0,R);
    g.addColorStop(0,"#ffffff33"); g.addColorStop(0.35,colors[i%colors.length]); g.addColorStop(1,colors[i%colors.length]);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,i*seg,(i+1)*seg); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.stroke();
    ctx.save(); ctx.rotate(i*seg + seg/2);
    ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.font = "700 27px system-ui, sans-serif";
    const lines = d.l.split("\n");
    lines.forEach((t,k)=> ctx.fillText(t, R-26, (k-(lines.length-1)/2)*30));
    ctx.restore();
  });
  ctx.restore();
  // outer ring with energy-level ticks
  ctx.beginPath(); ctx.arc(C,C,R,0,2*Math.PI); ctx.lineWidth = 8; ctx.strokeStyle = "#fff"; ctx.stroke();
  for(let i=0;i<48;i++){
    const a = i*2*Math.PI/48 + rot;
    ctx.beginPath(); ctx.arc(C+Math.cos(a)*(R+1),C+Math.sin(a)*(R+1),3,0,2*Math.PI);
    ctx.fillStyle = i%2 ? "#c026d3" : "#5b21b6"; ctx.fill();
  }
}
draw();

function winner(){
  const a = ((-Math.PI/2 - rot) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  return Math.floor(a/seg);
}

const hub = document.getElementById('hub'), again = document.getElementById('again'), result = document.getElementById('result');

function spin(){
  if(spinning) return;
  spinning = true; hub.disabled = true; again.disabled = true;
  result.innerHTML = '<div class="tag">state: |superposition⟩</div><div class="d">Measuring…</div>';
  const start = rot, extra = (5 + Math.random()*3)*2*Math.PI + Math.random()*2*Math.PI;
  const dur = 4200, t0 = performance.now();
  (function frame(now){
    const p = Math.min((now-t0)/dur,1), e = 1-Math.pow(1-p,4);
    rot = start + extra*e; draw();
    if(p<1) return requestAnimationFrame(frame);
    spinning = false; hub.disabled = false; again.disabled = false;
    const d = dares[winner()];
    result.innerHTML = `<div class="tag">wave function collapsed ✓</div><div class="d">${d.d}</div><div class="n">${d.n}<br>Then claim your chocolate 🍫</div>`;
    again.hidden = false;
  })(t0);
}
hub.onclick = spin; again.onclick = spin;
</script>
</body>
</html>
